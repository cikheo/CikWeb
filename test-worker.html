<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试 Cloudflare Worker CORS 代理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }
    .result.show {
      display: block;
    }
    .result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    .result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .result.info {
      background: #d1ecf1;
      border: 1px solid #bee5eb;
      color: #0c5460;
    }
    .result-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 16px;
    }
    pre {
      background: rgba(0, 0, 0, 0.05);
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      margin-top: 10px;
      font-size: 12px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .tips {
      background: #fff3cd;
      border: 1px solid #ffeaa7;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #856404;
    }
    .tips-title {
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 测试 Cloudflare Worker</h1>
    <p class="subtitle">测试 CORS 代理是否正常工作</p>

    <div class="tips">
      <div class="tips-title">💡 使用说明</div>
      <ol style="margin-left: 20px; margin-top: 8px;">
        <li>在 Cloudflare 部署 Worker 后，复制 Worker URL</li>
        <li>将 Worker URL 粘贴到下方输入框</li>
        <li>点击"测试连接"按钮</li>
        <li>如果测试成功，将 URL 更新到 src/data/status.ts</li>
      </ol>
    </div>

    <div class="input-group">
      <label for="workerUrl">Cloudflare Worker URL</label>
      <input 
        type="text" 
        id="workerUrl" 
        placeholder="https://your-worker.your-subdomain.workers.dev"
        value="https://uptime.cikheo.workers.dev/"
      >
    </div>

    <div class="input-group">
      <label for="apiKey">UptimeRobot API Key</label>
      <input 
        type="text" 
        id="apiKey" 
        placeholder="ur3257177-xxxxxxxxxxxxx"
        value="ur3257177-f4dc46bca49d4ede174ebc30"
      >
    </div>

    <button class="btn" onclick="testWorker()">
      <span id="btnText">测试连接</span>
    </button>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function testWorker() {
      const workerUrl = document.getElementById('workerUrl').value.trim()
      const apiKey = document.getElementById('apiKey').value.trim()
      const resultDiv = document.getElementById('result')
      const btnText = document.getElementById('btnText')
      const btn = document.querySelector('.btn')

      // 验证输入
      if (!workerUrl || workerUrl === 'https://your-worker.your-subdomain.workers.dev') {
        showResult('error', '请先输入你的 Cloudflare Worker URL')
        return
      }

      if (!apiKey) {
        showResult('error', '请输入 UptimeRobot API Key')
        return
      }

      // 开始测试
      btn.disabled = true
      btnText.innerHTML = '<span class="spinner"></span>正在测试...'
      showResult('info', '正在连接到 Worker...')

      try {
        const startTime = Date.now()
        
        // 发送测试请求
        const response = await fetch(workerUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            api_key: apiKey,
            format: 'json',
            logs: '0',
            response_times: '1',
            response_times_limit: '1'
          })
        })

        const endTime = Date.now()
        const duration = endTime - startTime

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`)
        }

        const data = await response.json()

        if (data.stat === 'ok') {
          const monitorCount = data.monitors?.length || 0
          showResult('success', 
            `<div class="result-title">✅ 测试成功！</div>
            <div>• 响应时间: ${duration}ms</div>
            <div>• 监控站点数: ${monitorCount}</div>
            <div>• CORS 代理: 正常工作</div>
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #c3e6cb;">
              <strong>下一步：</strong>将以下 URL 复制到 <code>src/data/status.ts</code> 的第 13 行：<br>
              <pre>apiUrl: '${workerUrl}',</pre>
            </div>`
          )
        } else {
          throw new Error(data.error?.message || 'API 返回错误')
        }
      } catch (error) {
        let errorMsg = error.message
        let tips = ''

        if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
          errorMsg = '无法连接到 Worker'
          tips = `
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #f5c6cb;">
              <strong>可能的原因：</strong><br>
              1. Worker URL 不正确<br>
              2. Worker 尚未部署或部署失败<br>
              3. Worker 代码存在错误<br>
              4. 网络连接问题
            </div>
          `
        } else if (errorMsg.includes('401') || errorMsg.includes('Unauthorized')) {
          errorMsg = 'API Key 无效'
          tips = '<div style="margin-top: 8px;">请检查你的 UptimeRobot API Key 是否正确</div>'
        }

        showResult('error', 
          `<div class="result-title">❌ 测试失败</div>
          <div><strong>错误信息:</strong> ${errorMsg}</div>
          ${tips}`
        )
      } finally {
        btn.disabled = false
        btnText.textContent = '测试连接'
      }
    }

    function showResult(type, message) {
      const resultDiv = document.getElementById('result')
      resultDiv.className = `result ${type} show`
      resultDiv.innerHTML = message
    }

    // 回车键提交
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        testWorker()
      }
    })
  </script>
</body>
</html>
