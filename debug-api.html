<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Debug API</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    pre { background: #2d2d2d; padding: 15px; border-radius: 5px; overflow-x: auto; }
    .success { color: #4ec9b0; }
    .error { color: #f48771; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>🔍 Status API 调试工具</h2>
  <button onclick="testAPI()">测试 API 调用</button>
  <div id="output"></div>

  <script>
    async function testAPI() {
      const output = document.getElementById('output');
      output.innerHTML = '<pre>正在测试...</pre>';

      const apiUrl = 'https://uptime.cikheo.workers.dev/';
      const apiKey = 'ur3257177-f4dc46bca49d4ede174ebc30';

      try {
        console.log('1. 发送请求到:', apiUrl);
        
        const startTime = Date.now();
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            api_key: apiKey,
            format: 'json',
            logs: '0',
            response_times: '1',
            response_times_limit: '12',
            custom_uptime_ranges: generateTimeRanges(),
            response_times_start_date: String(getTwentyFourHoursAgo()),
            response_times_end_date: String(getCurrentTimestamp()),
          })
        });
        
        const duration = Date.now() - startTime;
        
        console.log('2. 响应状态:', response.status);
        console.log('3. 响应头:', [...response.headers.entries()]);

        const text = await response.text();
        console.log('4. 响应内容:', text);

        let result = `<pre class="success">✅ API 调用成功\n\n`;
        result += `响应时间: ${duration}ms\n`;
        result += `状态码: ${response.status}\n`;
        result += `CORS 头: ${response.headers.get('access-control-allow-origin')}\n\n`;

        try {
          const data = JSON.parse(text);
          result += `API 状态: ${data.stat}\n`;
          result += `监控站点数: ${data.monitors?.length || 0}\n\n`;
          result += `完整响应:\n${JSON.stringify(data, null, 2)}</pre>`;
        } catch (e) {
          result += `⚠️ JSON 解析失败\n\n原始响应:\n${text}</pre>`;
        }

        output.innerHTML = result;
      } catch (error) {
        console.error('错误:', error);
        output.innerHTML = `<pre class="error">❌ 请求失败

错误类型: ${error.name}
错误信息: ${error.message}

完整错误:
${error.stack}</pre>`;
      }
    }

    function generateTimeRanges() {
      const date = new Date();
      const start = new Date(date);
      start.setHours(0, 0, 0, 0);
      const end = new Date(date);
      end.setHours(23, 59, 59, 999);
      return `${Math.floor(start.getTime() / 1000)}_${Math.floor(end.getTime() / 1000)}`;
    }

    function getTwentyFourHoursAgo() {
      return Math.floor((Date.now() - 12 * 60 * 60 * 1000) / 1000);
    }

    function getCurrentTimestamp() {
      return Math.floor(Date.now() / 1000);
    }

    // 自动测试
    window.onload = () => testAPI();
  </script>
</body>
</html>
